name: SAST SonarQube
description: >-
  Run a single SonarQube Community Build scan against a checked-out project
  and return a normalized, tool-agnostic findings JSON file. Assumes a
  SonarQube instance is already up and reachable (see docker-compose.ephemeral.yml
  and scripts/wait_for_sonarqube.sh / scripts/bootstrap_sonarqube.sh, which are
  invoked by the calling workflow, not by this action).
author: vln-devsecops

inputs:
  sonar-host-url:
    description: Base URL of the running SonarQube instance.
    required: false
    default: http://localhost:9000
  sonar-token:
    description: User token to authenticate to SonarQube with.
    required: true
  project-key:
    description: SonarQube project key to analyze and report findings under.
    required: true
  project-base-dir:
    description: Path to the checked-out project to scan.
    required: true
  scan-timeout-seconds:
    description: How long to wait for the SonarQube background compute-engine task to finish.
    required: false
    default: "600"
  sast-config-path:
    description: >-
      Path, relative to project-base-dir, to an optional noise-reduction
      config file (sonar.exclusions, sonar.coverage.exclusions,
      sonar.cpd.exclusions, sonar.issue.ignore.multicriteria - see
      scripts/build_scan_config.py and the README). Skipped entirely if the
      file doesn't exist.
    required: false
    default: .sastrc
  sast-ignore-path:
    description: >-
      Path, relative to project-base-dir, to an optional path-exclusions
      file using .gitignore syntax, merged into the same exclusions
      .sastrc produces. Skipped entirely if the file doesn't exist.
    required: false
    default: .sastignore
  scm-disabled:
    description: >-
      Set "true" to disable the scanner's SCM sensor (sonar.scm.disabled).
      Use this when project-base-dir is a shallow checkout - without it the
      scanner logs a "Shallow clone detected" warning plus one "Missing
      blame information" line per file. Leave "false" (the default) for any
      checkout that has full git history available.
    required: false
    default: "false"
  fail-on-unanalyzed-languages:
    description: >-
      Set "true" to fail this action when project-base-dir contains files
      this scan did not analyze: with scanner-mode "cli", C# and VB.NET (not
      covered without the Scanner for .NET); with scanner-mode "dotnet", C#
      and VB.NET files build-command did not compile; in both modes C, C++,
      Objective-C, Swift (no Community Build plugin at all; see
      scripts/detect_unanalyzed_languages.py
      and the unanalyzed-languages output below). The findings-json and
      findings-report outputs are still produced first, so callers that read
      them with `if: always()` still get a result. Default "false": warn
      only (::warning:: annotation, job summary, a banner in the findings
      report, and - from sonar-pr.yml - the Check Run summary and PR
      comment), so a clean result is never shown silently, without yet
      failing existing @v1 callers that have incidental files in one of
      these languages.
    required: false
    default: "false"
  scanner-mode:
    description: >-
      Which scanner to run. "cli" (the default, unchanged): sonar-scanner-cli
      in Docker - no build, but it cannot analyze C#/VB.NET. "dotnet": the
      SonarScanner for .NET on the runner (`begin`, build-command, `end`,
      all from project-base-dir) - the only way C# is actually analyzed.
      dotnet mode is Linux runners and SDK-style projects only, and RUNS
      build-command - the code under scan - on the runner; see the README's
      trust note before using it on pull requests from forks. It fails if
      build-command, `begin` or `end` fail, or if any project the build
      touched was not analyzed (a partially failed build, a duplicate or
      invalid ProjectGuid). .sastrc `tests.paths` is rejected in this mode
      (MSBuild decides which projects are tests), and coverage import is
      not supported.
    required: false
    default: cli
  build-command:
    description: >-
      Required with scanner-mode "dotnet", rejected otherwise. A shell
      command that builds the code to analyze, e.g. "dotnet build
      MySolution.sln". Run with `bash -c` from project-base-dir, between
      the scanner's `begin` and `end` steps. SONAR_TOKEN is removed from its
      environment as hygiene only - build code can still read the token
      (e.g. from the parent process's environment); see the README's trust
      note. One begin/end per invocation: for several solutions,
      pass a command (or script) that builds them all. A non-zero exit
      fails the action.
    required: false
    default: ""
  dotnet-version:
    description: >-
      .NET SDK version(s) for actions/setup-dotnet, which runs only with
      scanner-mode "dotnet". Must be able to build the project.
    required: false
    default: "10.0.x"
  import-roslyn-issues:
    description: >-
      scanner-mode "dotnet" only. Set "true" to also import issues from the
      project's own Roslyn analyzers (StyleCop, CA*, compiler warnings) as
      external issues. Default "false": only Sonar's own C# rules
      (sonar.cs.roslyn.ignoreIssues=true) - a repo's own analyzers are
      already enforced by its build, and imported they can drown the
      findings.
    required: false
    default: "false"
  nuget-auth-token:
    description: >-
      Optional, scanner-mode "dotnet" only. A token/API key for a private
      NuGet feed build-command needs to restore from (e.g. a GitHub
      Packages or Azure Artifacts PAT). Exposed as NUGET_AUTH_TOKEN to the
      "Run SonarQube scan" step - and so to build-command, the same way
      SONAR_TOKEN is NOT (see run_scan.sh's `env -u SONAR_TOKEN`) - but not
      to any other step of this action (fetch/report run as separate
      composite steps with their own `env:`). Empty by default: most
      callers restore from public NuGet feeds only. A pull_request from a
      fork gets no secrets at all (GitHub's own behavior, not this
      action's), so a private-feed restore fails loudly there rather than
      scanning nothing - the action already fails the job on any
      build-command failure.
    required: false
    default: ""

outputs:
  findings-json:
    description: Path to the normalized findings JSON file produced by this scan.
    value: ${{ steps.fetch.outputs.findings-json }}
  findings-report:
    description: >-
      Path to a human-readable Markdown report of every finding, with exact
      locations (path:line) - see scripts/render_findings_report.py. Exists
      because the SonarQube instance this action spins up is ephemeral, so
      once the job ends there's no SonarQube UI left to browse for issue
      detail; callers are expected to upload this as a build artifact or
      surface it in a job summary.
    value: ${{ steps.report.outputs.findings-report }}
  unanalyzed-languages:
    description: >-
      Comma-separated list of languages present under project-base-dir that
      this scan did NOT analyze (empty string when none) - see
      scripts/detect_unanalyzed_languages.py. A non-empty value means the
      findings above say nothing about these files: they were not analyzed,
      not analyzed-and-clean.
    value: ${{ steps.scan.outputs.unanalyzed-languages }}
  failure-reason:
    description: >-
      Empty on success. When the scan step fails, a fixed reason code naming
      why (see scripts/run_scan.sh's `fail` calls). Input and setup:
      invalid-scanner-mode, build-command-required,
      build-command-not-allowed, project-base-dir-missing,
      workspace-inaccessible, project-base-dir-outside-workspace (resolves
      outside GITHUB_WORKSPACE), invalid-sast-config (a .sastrc,
      .sastignore or sonar-project.properties rejected - before the scan,
      or when detection re-reads them after it). dotnet mode:
      scanner-install-failed, begin-failed, build-command-failed,
      end-failed, no-analyzable-projects, check-failed, project-not-built,
      project-not-analyzed. cli mode: scanner-failed. Either mode:
      no-report-task, ce-task-failed, ce-task-timeout. Also written to the
      job summary. Lets a caller tell an intended block from a setup error.
    value: ${{ steps.scan.outputs.failure-reason }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Set up .NET SDK
      # Explicit comparison, never a bare truthy `if: ${{ inputs.x }}`: any
      # non-empty string (including "false") is truthy there.
      if: inputs.scanner-mode == 'dotnet'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Run SonarQube scan
      id: scan
      shell: bash
      env:
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        PROJECT_KEY: ${{ inputs.project-key }}
        PROJECT_BASE_DIR: ${{ inputs.project-base-dir }}
        SCAN_TIMEOUT_SECONDS: ${{ inputs.scan-timeout-seconds }}
        COMPOSE_FILE: ${{ github.action_path }}/docker-compose.ephemeral.yml
        SAST_CONFIG_FILE: ${{ inputs.project-base-dir }}/${{ inputs.sast-config-path }}
        SAST_IGNORE_FILE: ${{ inputs.project-base-dir }}/${{ inputs.sast-ignore-path }}
        SCM_DISABLED: ${{ inputs.scm-disabled }}
        SCANNER_MODE: ${{ inputs.scanner-mode }}
        # Passed via env only - never interpolate build-command into `run:`
        # (script injection); run_scan.sh hands it to `bash -c` as-is.
        BUILD_COMMAND: ${{ inputs.build-command }}
        IMPORT_ROSLYN_ISSUES: ${{ inputs.import-roslyn-issues }}
        # Inherited by build-command's own subshell (run_scan.sh does NOT
        # `env -u` it, unlike SONAR_TOKEN) - never read by begin/end, since
        # neither needs it, and never passed to the fetch/report steps
        # below, which have their own `env:` and don't inherit this one's.
        NUGET_AUTH_TOKEN: ${{ inputs.nuget-auth-token }}
      run: "${{ github.action_path }}/scripts/run_scan.sh"

    - name: Fetch and normalize findings
      id: fetch
      shell: bash
      run: |
        set -euo pipefail
        out_dir="${RUNNER_TEMP:-/tmp}/sonar-findings"
        mkdir -p "$out_dir"
        out_file="$out_dir/${{ inputs.project-key }}.json"
        python3 "${{ github.action_path }}/scripts/fetch_findings.py" \
          --host "${{ inputs.sonar-host-url }}" \
          --token "${{ inputs.sonar-token }}" \
          --project-key "${{ inputs.project-key }}" \
          --out "$out_file"
        echo "findings-json=$out_file" >> "$GITHUB_OUTPUT"

    - name: Render findings report
      id: report
      shell: bash
      env:
        UNANALYZED_LANGUAGES: ${{ steps.scan.outputs.unanalyzed-languages }}
      run: |
        set -euo pipefail
        out_dir="${RUNNER_TEMP:-/tmp}/sonar-findings"
        mkdir -p "$out_dir"
        report_file="$out_dir/${{ inputs.project-key }}-report.md"
        python3 "${{ github.action_path }}/scripts/render_findings_report.py" \
          --findings "${{ steps.fetch.outputs.findings-json }}" \
          --project-key "${{ inputs.project-key }}" \
          --unanalyzed-languages "$UNANALYZED_LANGUAGES" \
          --out "$report_file"
        echo "findings-report=$report_file" >> "$GITHUB_OUTPUT"

    - name: Report unanalyzed languages
      # Runs after findings-json and findings-report are both written (the
      # two steps above), so a fail-on-unanalyzed-languages=true failure
      # here never costs a caller those outputs - see the input's
      # description. Surfaces the result everywhere a clean scan could
      # otherwise look clean by omission: a ::warning:: annotation, the job
      # summary here; render_findings_report.py already put a banner at the
      # top of the report above, and sonar-pr.yml's apply_policy.py /
      # post_pr_comment.py add the Check Run summary and PR comment.
      id: unanalyzed
      shell: bash
      env:
        UNANALYZED_LANGUAGES: ${{ steps.scan.outputs.unanalyzed-languages }}
        FAIL_ON_UNANALYZED_LANGUAGES: ${{ inputs.fail-on-unanalyzed-languages }}
      run: |
        set -euo pipefail
        if [[ -n "$UNANALYZED_LANGUAGES" ]]; then
          message="This scan did NOT analyze: ${UNANALYZED_LANGUAGES} - this scan's scanner can't analyze these languages, or (scanner-mode: dotnet) build-command didn't compile these files, so the absence of findings above says nothing about these files."
          echo "::warning::${message}"
          {
            echo "### SonarQube Community: languages not analyzed"
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FAIL_ON_UNANALYZED_LANGUAGES" == "true" ]]; then
            echo "Failing: fail-on-unanalyzed-languages is true and the above languages were not analyzed." >&2
            exit 1
          fi
        fi
