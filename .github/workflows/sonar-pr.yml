name: SonarQube Community PR scan

on:
  workflow_call:
    inputs:
      project-key:
        description: >-
          SonarQube project key to scan under. Only needs to be unique within
          a single job's ephemeral instance (every run gets a fresh
          SonarQube), so the repo name is a fine default - note SonarQube
          project keys can't contain "/", so this deliberately isn't
          github.repository (owner/repo).
        type: string
        default: ${{ github.event.repository.name }}
      project-base-dir:
        description: Path (relative to the repo root) to scan.
        type: string
        default: .
      severity-threshold:
        description: Minimum legacy severity (INFO/MINOR/MAJOR/CRITICAL/BLOCKER) a new finding must have to block the job.
        type: string
        default: MAJOR
      blocking:
        description: Whether a new finding at or above severity-threshold fails the job.
        type: boolean
        default: true
      post-pr-comment:
        description: Whether to post/update a human-readable summary comment on the PR.
        type: boolean
        default: true
      check-name:
        description: Name of the GitHub Check Run this workflow creates.
        type: string
        default: sonarqube-community/new-findings
      findings-report-retention-days:
        description: >-
          Retention period for the uploaded findings-report artifact (the
          full current finding set, with exact locations - see
          scripts/render_findings_report.py). Shorter than a baseline
          artifact's default retention since this is a per-PR debugging aid,
          not something later runs resolve by name.
        type: number
        default: 30
      sast-config-path:
        description: >-
          Path, relative to project-base-dir, to an optional noise-reduction
          config file (see the action README's ".sastrc" section).
        type: string
        default: .sastrc
      sast-ignore-path:
        description: >-
          Path, relative to project-base-dir, to an optional .gitignore-syntax
          path-exclusions file (see the action README's ".sastignore" section).
        type: string
        default: .sastignore
      baseline-scm-history:
        description: >-
          Whether the fallback baseline scan (see "Baseline resolution for
          PRs" in the README) should have git history available for SCM/blame
          analysis. Defaults to false: the baseline checkout stays shallow
          and the scanner's SCM sensor is disabled, so no blame warnings are
          emitted for a scan whose findings are only ever diffed, never
          browsed for authorship. Set true to fetch full history and let the
          scanner read blame data instead.
        type: boolean
        default: false
      runner-type:
        description: >-
          Value for runs-on. Defaults to ubuntu-latest. Reusable-workflow
          event context note: contrary to what an earlier version of this
          comment claimed, github.event_name/github.event here are NOT
          always "workflow_call" - "When a reusable workflow is triggered
          by a caller workflow, the github context is always associated
          with the caller workflow" -
          https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations -
          so both are the CALLER's (e.g. "pull_request"), the same as
          github.event.pull_request.head.repo.full_name is (the "Post PR
          summary comment" step below, and the fork-PR gate in scanner-mode
          dotnet, both rely on exactly that, and both predate this comment's
          correction). What this workflow genuinely can't do is pick a self-hosted runner
          pool on a caller's behalf - that's a caller-specific policy
          (which labels exist, which are "sensitive"), not something to
          infer from event data - so callers that want one still resolve
          and pass it here themselves. On a self-hosted runner, scanner-mode
          dotnet's build-command runs PR code ON THAT RUNNER (not inside the
          Docker container cli mode uses), so a caller's fork-PR guard on
          this input matters even more there - the fork-PR gate below stops
          an AUTOMATIC fork-PR run, but a self-hosted pool's own capacity/
          isolation policy for TRUSTED same-repo PRs is still the caller's
          to set.
        type: string
        default: ubuntu-latest
      fail-on-unanalyzed-languages:
        description: >-
          Set true to fail this job when project-base-dir contains files in
          a language the plain sonar-scanner-cli can't analyze (see the
          action's unanalyzed-languages output and README). The action
          itself fails (after its findings-json/findings-report outputs are
          written) - this job still runs the diff/policy/comment steps
          afterward so the Check Run and PR comment carry the result too,
          but the job as a whole still ends in failure. Default false: warn
          only - matches this action's v1 behavior.
        type: boolean
        default: false
      timeout-minutes:
        description: >-
          Value for the job's timeout-minutes. Default 30 (this job's
          historical hard-coded value, so existing callers see no change).
          scanner-mode dotnet may need more: it's a second restore + build +
          scan on the fallback path (two builds in one job) on top of the
          cli path's single scan, so a repo with a slow build should raise
          this.
        type: number
        default: 30
      scanner-mode:
        description: >-
          Forwarded to every scan this job runs (PR head, and the fallback
          baseline scan when it fires). "cli" (default, unchanged): never
          executes PR code, so the fork-PR gate below never applies to it -
          a PR from a fork still gets a full scan automatically, same as
          today. "dotnet": runs build-command - the code under scan - on
          the runner; see this input's own description on action.yml and
          the README's trust note before using it. In dotnet mode, a PR
          from a fork is NOT scanned automatically by this job - see
          pr-number below and the README's "Fork PRs" / C# sections.
        type: string
        default: cli
      build-command:
        description: >-
          Forwarded to every scan this job runs, same as scanner-mode.
          Required with scanner-mode dotnet, rejected otherwise - see
          action.yml's build-command input.
        type: string
        default: ""
      dotnet-version:
        description: Forwarded to every scan this job runs, same as scanner-mode. See action.yml's dotnet-version input.
        type: string
        default: "10.0.x"
      import-roslyn-issues:
        description: Forwarded to every scan this job runs, same as scanner-mode. See action.yml's import-roslyn-issues input.
        type: boolean
        default: false
      pr-number:
        description: >-
          Required (functionally - see resolve_pr_context.py; this input
          itself stays optional so pull_request-triggered callers are
          unaffected) with github.event_name == workflow_dispatch - the PR
          number a maintainer is dispatching a scanner-mode: dotnet scan
          for, on a PR this job otherwise can't run automatically for (a
          fork PR - see the "Trust boundary" gate below). Always paired
          with head-sha below - a PR number alone isn't enough, see there
          for why. Wire this from the caller's own workflow_dispatch input
          - its github.event.inputs.pr-number - via this input's `with:`
          entry when invoking this workflow (see the README for the exact
          YAML). Ignored (unused) on a pull_request-triggered run - that
          event already carries its own PR number.
        type: string
        default: ""
      head-sha:
        description: >-
          Required (functionally, same as pr-number above) alongside
          pr-number for workflow_dispatch - the full 40-character commit
          SHA a maintainer actually reviewed before dispatching, copied
          from the PR's commit list. Re-checked against the PR's LIVE head
          via the GitHub API (resolve_pr_context.py's
          verify_dispatch_pr_context()) before anything is checked out or
          built: a fork can push a new, unreviewed commit after the review
          but before this run starts (or while it's queued) - without this
          check, THAT commit is what would actually get built with this
          job's write-scoped tokens, not the one anyone looked at. A
          mismatch (or a closed/merged PR, or an API response missing any
          of head/base SHA or base ref) fails the run with a message naming
          what changed, asking for a fresh review and dispatch. Ignored
          (unused) on a pull_request-triggered run.
        type: string
        default: ""
    secrets:
      nuget-auth-token:
        description: >-
          Optional, scanner-mode dotnet only. Forwarded to action.yml's
          nuget-auth-token input on every scan this job runs - a credential
          for a private NuGet feed build-command needs to restore from.
          Exposed to the build step only (see action.yml); never to begin/
          end or any other step of this workflow. A pull_request from a
          fork gets NO secrets at all except a read-only GITHUB_TOKEN
          (GitHub's own behavior) - moot for the automatic case in dotnet
          mode, since the fork-PR gate below blocks it before any build
          runs, but still true for a maintainer-triggered workflow_dispatch
          scan of a fork PR's build-command restoring from a private feed:
          wire this secret through the caller's own `secrets:` block (or
          `secrets: inherit`) if that scan needs it. A missing/empty value
          here just means build-command restores from public feeds only;
          the action already fails loudly on any build-command failure
          rather than silently scanning nothing.
        required: false

jobs:
  pr-scan:
    runs-on: ${{ inputs.runner-type }}
    # Every long step below has its own deadline (wait_for_sonarqube.sh 300s,
    # run_scan.sh 600s), but image pulls and `docker compose up` don't - so
    # cap the job rather than inherit the 6-hour default on a wedged runner.
    # See the timeout-minutes input's description for why dotnet-mode
    # callers may want to raise this.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: Set up Python
        # Moved ahead of every checkout (including "Checkout PR head"
        # below): the fork-PR gate (see "Resolve PR/dispatch context" and
        # "Gate" below) has to run, and decide whether to check out the
        # PR's code at all, before that checkout happens - and it needs
        # Python to run resolve_pr_context.py.
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # This reusable workflow is meant to be called by other repos, so it
      # can't assume its own composite action (action.yml) is checked out at
      # the workspace root - that root holds the CALLER's code. Fetch this
      # action's own repo, pinned to the exact ref this workflow file itself
      # is running from, into a side directory instead. Safe to run ahead of
      # the fork-PR gate below (unlike "Checkout PR head"): this checks out
      # OUR OWN trusted source at a pinned ref, never the PR's code.
      - name: Resolve this action's own source ref
        id: action-source
        env:
          # github.workflow_ref is the *top-level* workflow that triggered
          # this run - for an external caller that's the CALLER's workflow
          # file, not this one. job.workflow_ref (job context, not github
          # context - there is no such thing as github.job_workflow_ref)
          # is the ref of the reusable workflow actually running this job,
          # which is what we need to check out our own source.
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          ref="${WORKFLOW_REF#*@}"
          repo="${WORKFLOW_REF%%/.github/*}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout this action's source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.action-source.outputs.repo }}
          ref: ${{ steps.action-source.outputs.ref }}
          path: .sast-sonarqube
          persist-credentials: false

      # --- Trust boundary: scanner-mode dotnet fork-PR gate -----------------
      # (docs/csharp-support-plan.md, "Trust boundary" and the 2026-11-12
      # decision). scanner-mode: dotnet runs build-command on the runner, so
      # it can only run automatically for a pull request from a branch in
      # the SAME repository - a fork PR gets it only via a maintainer-
      # triggered workflow_dispatch naming the PR number. cli mode never
      # executes PR code, so this never blocks it - see resolve_pr_context.py.
      - name: Resolve PR/dispatch context
        id: pr-context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every value below is an argv entry, not interpolated directly
          # into the script text - env: is how this file keeps every
          # ${{ }} out of `run:`'s shell text everywhere else, and this
          # step is no different, even though every value here happens to
          # come from a workflow_call input or a trusted github.* context
          # field today: a future change (or a caller passing something
          # less trustworthy through one of these inputs) must not need to
          # remember to do this then.
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          SCANNER_MODE: ${{ inputs.scanner-mode }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr-number }}
          DISPATCH_HEAD_SHA: ${{ inputs.head-sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Under $RUNNER_TEMP, not a bare workspace-root filename: this
          # runs before "Checkout PR head" below, so nothing PR-controlled
          # is on the root yet today, but every intermediate file this job
          # writes lives under $RUNNER_TEMP uniformly now (see
          # tests/test_check_checkout_order.py's find_workspace_write_violations)
          # rather than depending on step order to stay safe.
          pr_context_file="$RUNNER_TEMP/pr-context.json"
          python3 .sast-sonarqube/scripts/resolve_pr_context.py \
            --event-name "$EVENT_NAME" \
            --event-file "$EVENT_PATH" \
            --scanner-mode "$SCANNER_MODE" \
            --dispatch-pr-number "$DISPATCH_PR_NUMBER" \
            --dispatch-head-sha "$DISPATCH_HEAD_SHA" \
            --repo "$REPO" \
            --out "$pr_context_file"
          # Deliberately NOT keyed off the python3 invocation's own exit
          # code (python_status=$? and `exit "${python_status:-1}"`, as
          # this used to read): that's a second signal that has to stay in
          # lockstep with the JSON's own `action` field by construction,
          # not by anything enforced here, so a future resolve_pr_context.py
          # change that writes action: error without also calling
          # sys.exit(1) would silently exit 0 here and let every step
          # below run anyway. The JSON's `action` - already the one value
          # this whole step exists to compute - is the one and only thing
          # this check depends on now.
          action="$(jq -r '.action // "error"' "$pr_context_file" 2>/dev/null || echo error)"
          reason="$(jq -r '.reason // "resolve_pr_context.py produced no output"' "$pr_context_file" 2>/dev/null || echo "resolve_pr_context.py produced no output")"
          pr_number="$(jq -r '.pr_number // ""' "$pr_context_file" 2>/dev/null)"
          is_fork="$(jq -r '.is_fork // ""' "$pr_context_file" 2>/dev/null)"
          head_sha="$(jq -r '.head_sha // ""' "$pr_context_file" 2>/dev/null)"
          base_sha="$(jq -r '.base_sha // ""' "$pr_context_file" 2>/dev/null)"
          base_ref="$(jq -r '.base_ref // ""' "$pr_context_file" 2>/dev/null)"
          {
            echo "action=${action}"
            echo "reason=${reason}"
            echo "pr-number=${pr_number}"
            echo "is-fork=${is_fork}"
            echo "head-sha=${head_sha}"
            echo "base-sha=${base_sha}"
            echo "base-ref=${base_ref}"
          } >> "$GITHUB_OUTPUT"
          if [[ "$action" == "error" ]]; then
            echo "::error::${reason}"
            {
              echo "### SonarQube Community: could not resolve PR/dispatch context"
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: "Gate: scanner-mode dotnet blocks an automatic fork-PR scan"
        # Fails BEFORE "Checkout PR head" below ever runs (every later step
        # in this job defaults to `if: success()`, so a failure here skips
        # them automatically) - the PR's code is never checked out, let
        # alone built, for a fork PR this job can't trust. A maintainer
        # re-runs it as a workflow_dispatch naming the PR number instead
        # (see the pr-number input) - that run skips this gate (its
        # action is "dispatch", not "block") and posts the named Check Run
        # on the PR's real head SHA once it finishes, same as any other run.
        if: steps.pr-context.outputs.action == 'block'
        env:
          REASON: ${{ steps.pr-context.outputs.reason }}
        run: |
          {
            echo "### SonarQube Community: scanner-mode dotnet blocked for this fork PR"
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::${REASON}"
          exit 1

      - name: Checkout PR head
        # Positive allowlist, not just reliance on "pr-context didn't fail
        # the job": the pr-context/Gate steps above are already correct on
        # their own (an "error"/"block" action exits non-zero, and this
        # step's own default `if: success()` would already skip it), but
        # this makes the condition for touching PR code explicit and
        # reviewable in one place rather than an emergent property of every
        # step's default - a future continue-on-error, or an "error"/"block"
        # path that stops failing its own step for some other reason, would
        # otherwise fail OPEN instead of closed.
        if: contains(fromJSON('["scan","dispatch"]'), steps.pr-context.outputs.action)
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-context.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      # "Checkout PR head" above has no `path:` - it targets the WORKSPACE
      # ROOT. actions/checkout deletes every entry under its target
      # directory first whenever that directory has no `.git` yet
      # (git-directory-helper.ts's prepareExistingDirectory():
      # `remove = true` when `<path>/.git` doesn't exist, then it rmRF's
      # every entry under `<path>`) - and the root never got a `.git` from
      # "Checkout this action's source" above, since THAT checkout's own
      # `path:` is the .sast-sonarqube subdirectory, not the root. So the
      # checkout above just deleted .sast-sonarqube along with everything
      # else that was under the root. Re-fetch it now, before anything
      # below reads from it again - without this, every scan/dispatch run
      # breaks (the scripts and the compose file are gone), and worse, a
      # PR that committed its OWN `.sast-sonarqube/` (this gate never
      # blocks that in cli mode, since it only applies to dotnet) would
      # have nothing standing between it and `uses: ./.sast-sonarqube`
      # resolving to that PR-supplied copy instead of ours.
      # tests/test_check_checkout_order.py enforces this ordering
      # structurally, not just by comment.
      #
      # One more hostile-tree case the re-checkout alone doesn't cover: a
      # PR can commit `.sast-sonarqube` itself as a SYMLINK (e.g. to
      # `../../..`, reaching outside the runner's work directory
      # entirely). actions/checkout's own existing-directory handling
      # follows a symlink at its target path the same way any other tool
      # would, so the re-checkout below could end up deleting (and then
      # writing into) whatever that symlink points at instead of a plain
      # subdirectory. Remove it explicitly first - `rm -rf --` with NO
      # trailing slash on the argument unlinks the symlink entry itself,
      # it does not follow it into its target.
      - name: Remove any PR-supplied .sast-sonarqube (may be a symlink)
        if: contains(fromJSON('["scan","dispatch"]'), steps.pr-context.outputs.action)
        run: rm -rf -- ./.sast-sonarqube

      - name: Re-checkout this action's source (the step above wiped it)
        if: contains(fromJSON('["scan","dispatch"]'), steps.pr-context.outputs.action)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.action-source.outputs.repo }}
          ref: ${{ steps.action-source.outputs.ref }}
          path: .sast-sonarqube
          persist-credentials: false

      # "Checkout PR head" above, with fetch-depth: 0, already fetched every
      # branch into refs/remotes/origin/* ("fetch-depth: Number of commits
      # to fetch. 0 indicates all history for all branches and tags" -
      # https://github.com/actions/checkout#readme; confirmed in its source,
      # getRefSpecForAllHistory() uses refspec
      # "+refs/heads/*:refs/remotes/origin/*" - every branch, not just the
      # ref being checked out). A SEPARATE `git fetch origin` step here was
      # redundant AND broken for private callers: persist-credentials: false
      # above means this step's own git has no credential to fetch with, so
      # it would 403/fail outright on a private repo (this repo is public,
      # so its own CI never caught it). Verify the branch is actually
      # there instead of re-fetching it.
      - name: Verify target branch ref is available
        if: contains(fromJSON('["scan","dispatch"]'), steps.pr-context.outputs.action)
        env:
          BASE_REF: ${{ steps.pr-context.outputs.base-ref }}
        run: |
          if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            echo "::error::origin/${BASE_REF} not found in this checkout. actions/checkout's fetch-depth: 0 should have fetched every branch - check that base-ref/base-sha were resolved correctly and that the base branch still exists."
            exit 1
          fi

      - name: Resolve merge-base and target HEAD
        id: refs
        env:
          BASE_REF: ${{ steps.pr-context.outputs.base-ref }}
          TARGET_HEAD_SHA: ${{ steps.pr-context.outputs.base-sha }}
          PROJECT_BASE_DIR: ${{ inputs.project-base-dir }}
        run: |
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "merge-base=${merge_base}" >> "$GITHUB_OUTPUT"
          echo "target-head-sha=${TARGET_HEAD_SHA}" >> "$GITHUB_OUTPUT"

          # SonarQube reports each finding's path relative to
          # project-base-dir, not the repo root - but `git diff` paths are
          # always repo-root-relative. Scope+strip to project-base-dir so
          # diff_findings.py's --changed-files filter is comparing the same
          # path space; otherwise, whenever project-base-dir isn't the repo
          # root, every finding looks "untouched" and gets dropped.
          # $RUNNER_TEMP, not a bare workspace-root filename: "Checkout PR
          # head" above already brought the PR's own tree onto the root,
          # so a hostile PR could pre-commit a symlink named
          # changed-files.txt here and have this redirect follow it onto
          # a runner-owned file (tests/test_check_checkout_order.py's
          # find_workspace_write_violations() enforces this).
          changed_files_file="$RUNNER_TEMP/changed-files.txt"
          base_dir="${PROJECT_BASE_DIR#./}"
          base_dir="${base_dir%/}"
          if [[ -z "$base_dir" || "$base_dir" == "." ]]; then
            git diff --name-only "${merge_base}..HEAD" > "$changed_files_file"
          else
            git diff --name-only "${merge_base}..HEAD" -- "$base_dir" \
              | sed "s#^${base_dir}/##" > "$changed_files_file"
          fi
          echo "Files touched by this PR (relative to project-base-dir):"
          cat "$changed_files_file"

      - name: "Look up baseline artifact (tier a: PR branch-off point)"
        id: tier-a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_NAME: sonar-baseline-${{ steps.refs.outputs.merge-base }}
        run: |
          # $RUNNER_TEMP: same reasoning as changed-files.txt above - a
          # bare .baseline-artifact would extract into whatever a
          # PR-committed symlink at that name points to.
          found="$(python3 .sast-sonarqube/scripts/find_baseline_artifact.py \
            --repo "$REPO" --name "$ARTIFACT_NAME" --dest "$RUNNER_TEMP/baseline-artifact")"
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      - name: "Look up baseline artifact (tier b: target branch current HEAD)"
        id: tier-b
        if: steps.tier-a.outputs.found != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_NAME: sonar-baseline-${{ steps.refs.outputs.target-head-sha }}
        run: |
          found="$(python3 .sast-sonarqube/scripts/find_baseline_artifact.py \
            --repo "$REPO" --name "$ARTIFACT_NAME" --dest "$RUNNER_TEMP/baseline-artifact")"
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      - name: Record baseline resolution
        id: baseline
        env:
          TIER_A_FOUND: ${{ steps.tier-a.outputs.found }}
          TIER_B_FOUND: ${{ steps.tier-b.outputs.found }}
          MERGE_BASE: ${{ steps.refs.outputs.merge-base }}
          TARGET_HEAD_SHA: ${{ steps.refs.outputs.target-head-sha }}
        run: |
          if [[ "$TIER_A_FOUND" == "true" ]]; then
            tier="tier a: artifact for merge-base ${MERGE_BASE}"
          elif [[ "$TIER_B_FOUND" == "true" ]]; then
            tier="tier b: artifact for target branch HEAD ${TARGET_HEAD_SHA}"
          else
            tier="fallback: no artifact found, scanning target branch HEAD live in this job"
          fi
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          {
            echo "### SonarQube Community baseline resolution"
            echo "${tier}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline resolution: ${tier}"

      # Clears .baseline-checkout first, with the exact same condition as
      # the checkout right below - see "Remove any PR-supplied
      # .sast-sonarqube" above and tests/test_check_checkout_order.py's
      # find_unprotected_subdirectory_checkouts() for the general pattern
      # this follows.
      - name: Harden fallback checkout path (.baseline-checkout)
        if: steps.tier-a.outputs.found != 'true' && steps.tier-b.outputs.found != 'true'
        run: rm -rf -- ./.baseline-checkout

      - name: Checkout target branch HEAD (fallback path only)
        if: steps.tier-a.outputs.found != 'true' && steps.tier-b.outputs.found != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-context.outputs.base-sha }}
          path: .baseline-checkout
          fetch-depth: ${{ inputs.baseline-scm-history && 0 || 1 }}
          persist-credentials: false

      # project-base-dir might not exist yet on the target branch at all -
      # e.g. this PR is the one introducing it. That's not a misconfiguration
      # (unlike project-base-dir missing from the PR head, which action.yml
      # rightly fails on): it just means there's nothing to compare against,
      # so every finding in the head scan is new by definition.
      - name: Check whether target branch has project-base-dir
        id: fallback-base-dir-check
        if: steps.tier-a.outputs.found != 'true' && steps.tier-b.outputs.found != 'true'
        env:
          PROJECT_BASE_DIR: ${{ inputs.project-base-dir }}
        run: |
          if [[ -d ".baseline-checkout/${PROJECT_BASE_DIR}" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start ephemeral SonarQube stack
        run: docker compose -f .sast-sonarqube/docker-compose.ephemeral.yml up -d

      - name: Wait for SonarQube to be ready
        run: .sast-sonarqube/scripts/wait_for_sonarqube.sh http://localhost:9000

      - name: Bootstrap admin token
        id: bootstrap
        run: |
          token="$(.sast-sonarqube/scripts/bootstrap_sonarqube.sh http://localhost:9000 gha-pr)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # fail-on-unanalyzed-languages is deliberately NOT passed here: this
      # scans the *baseline* (target branch), only ever diffed against, never
      # itself the subject of this PR's gate - failing the job over the
      # baseline's unanalyzed files would block a PR that didn't introduce
      # them. The PR's own head-scan below is where that input applies.
      # continue-on-error only in dotnet mode: see "Handle a dotnet fallback
      # build failure" below for why (the 2026-11-12 "Fallback baseline in
      # dotnet mode" decision) - cli mode keeps failing this job immediately
      # on any fallback-scan failure, exactly as before this input existed.
      - name: Scan target branch HEAD (fallback path only)
        id: fallback-base-scan
        if: steps.fallback-base-dir-check.outputs.exists == 'true'
        continue-on-error: ${{ inputs.scanner-mode == 'dotnet' }}
        uses: ./.sast-sonarqube
        with:
          sonar-host-url: http://localhost:9000
          sonar-token: ${{ steps.bootstrap.outputs.token }}
          project-key: ${{ inputs.project-key }}-fallback-base
          project-base-dir: .baseline-checkout/${{ inputs.project-base-dir }}
          sast-config-path: ${{ inputs.sast-config-path }}
          sast-ignore-path: ${{ inputs.sast-ignore-path }}
          scm-disabled: ${{ inputs.baseline-scm-history && 'false' || 'true' }}
          scanner-mode: ${{ inputs.scanner-mode }}
          build-command: ${{ inputs.build-command }}
          dotnet-version: ${{ inputs.dotnet-version }}
          import-roslyn-issues: ${{ inputs.import-roslyn-issues }}
          nuget-auth-token: ${{ secrets.nuget-auth-token }}

      # scanner-mode: dotnet, 2026-11-12 decision ("Fallback baseline in
      # dotnet mode"): if the target branch's own build fails here, use an
      # empty baseline (every PR head finding is reported as new) instead of
      # failing this job over code the PR didn't touch - but only when the
      # failure really was the build/analysis, not an unrelated problem
      # (SonarQube itself down, a bad scanner install, ...) that just
      # happens to also hit this step; baseline_fallback.py tells those
      # apart from the action's own failure-reason output. The "exit 1"
      # branch below re-raises everything else - continue-on-error above
      # suppressed this step's own natural job failure, so without this,
      # a non-build failure here would silently let the job carry on with
      # no baseline at all, resolved as a hard error two steps down instead
      # of here with a clear reason.
      - name: Handle a dotnet fallback build failure
        id: fallback-dotnet-build-failure
        if: inputs.scanner-mode == 'dotnet' && steps.fallback-base-scan.outcome == 'failure'
        env:
          REASON: ${{ steps.fallback-base-scan.outputs.failure-reason }}
        run: |
          set -euo pipefail
          is_build_failure="$(python3 .sast-sonarqube/scripts/baseline_fallback.py --reason "$REASON")"
          if [[ "$is_build_failure" != "true" ]]; then
            echo "::error::Fallback baseline scan (target branch) failed with failure-reason '${REASON}', which is not a build failure - not masking it as an empty baseline. See the scan step's log above."
            exit 1
          fi
          fallback_findings_file="$RUNNER_TEMP/fallback-build-failed-baseline.json"
          echo '[]' > "$fallback_findings_file"
          echo "findings-json=${fallback_findings_file}" >> "$GITHUB_OUTPUT"
          note="target branch build failed in dotnet mode (failure-reason: ${REASON}) - using an empty baseline, every PR head finding is reported as new"
          echo "note=${note}" >> "$GITHUB_OUTPUT"
          echo "::warning::${note}"
          {
            echo "### SonarQube Community baseline resolution (dotnet fallback)"
            echo "$note"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Use empty baseline (target branch lacks project-base-dir)
        id: fallback-empty-baseline
        if: steps.tier-a.outputs.found != 'true' && steps.tier-b.outputs.found != 'true' && steps.fallback-base-dir-check.outputs.exists != 'true'
        run: |
          empty_baseline_file="$RUNNER_TEMP/empty-baseline-findings.json"
          echo '[]' > "$empty_baseline_file"
          echo "findings-json=${empty_baseline_file}" >> "$GITHUB_OUTPUT"

      # Folds the dotnet-fallback-build-failure note (if any) into the tier
      # text computed above - the one baseline_tier string that already
      # flows to the job summary and (below) the PR comment, rather than a
      # separate channel for this one case.
      - name: Finalize baseline tier text
        id: baseline-final
        if: always()
        env:
          BASE_TIER: ${{ steps.baseline.outputs.tier }}
          BUILD_FAILURE_NOTE: ${{ steps.fallback-dotnet-build-failure.outputs.note }}
        run: |
          if [[ -n "$BUILD_FAILURE_NOTE" ]]; then
            tier="${BASE_TIER} - ${BUILD_FAILURE_NOTE}"
          else
            tier="$BASE_TIER"
          fi
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"

      - name: Scan PR head
        id: head-scan
        # Same positive allowlist as "Checkout PR head" above - this is the
        # step that actually executes build-command against whatever was
        # checked out, so it gets the same explicit, reviewable condition
        # rather than relying solely on the checkout above having been
        # skipped (which would leave project-base-dir missing and already
        # fail action.yml's own check, but that's a side effect, not a
        # guarantee this step was designed around).
        if: contains(fromJSON('["scan","dispatch"]'), steps.pr-context.outputs.action)
        uses: ./.sast-sonarqube
        with:
          sonar-host-url: http://localhost:9000
          sonar-token: ${{ steps.bootstrap.outputs.token }}
          project-key: ${{ inputs.project-key }}
          project-base-dir: ${{ inputs.project-base-dir }}
          sast-config-path: ${{ inputs.sast-config-path }}
          sast-ignore-path: ${{ inputs.sast-ignore-path }}
          fail-on-unanalyzed-languages: ${{ inputs.fail-on-unanalyzed-languages }}
          scanner-mode: ${{ inputs.scanner-mode }}
          build-command: ${{ inputs.build-command }}
          dotnet-version: ${{ inputs.dotnet-version }}
          import-roslyn-issues: ${{ inputs.import-roslyn-issues }}
          nuget-auth-token: ${{ secrets.nuget-auth-token }}

      # The full current finding set (not just this PR's new findings, which
      # the Check Run annotations already cover inline-on-diff) - the
      # SonarQube instance is ephemeral and torn down at the end of this
      # job, so this is the durable place to see exact locations without
      # re-running the scan. `!cancelled()` (not `always()`) so it still
      # uploads even if a later step (diff, policy) fails - the report
      # itself is already complete once the scan succeeds - but a manual
      # workflow cancellation still skips it, matching this step's
      # pre-existing behavior rather than racing a cancellation to upload
      # a possibly-incomplete report. Checking the findings-report *output*
      # rather than head-scan's outcome: the action's own
      # fail-on-unanalyzed-languages (see action.yml) deliberately fails
      # the "Scan PR head" step itself *after* findings-json/findings-report
      # are written, so outcome alone can no longer tell "never produced a
      # report" apart from "produced one, then failed on purpose".
      - name: Upload PR head findings report
        id: upload-report
        if: "!cancelled() && steps.head-scan.outputs.findings-report != ''"
        uses: actions/upload-artifact@v7
        with:
          name: sonar-pr-${{ steps.pr-context.outputs.pr-number }}-findings-report
          path: ${{ steps.head-scan.outputs.findings-report }}
          retention-days: ${{ inputs.findings-report-retention-days }}

      - name: Record findings report link
        if: always() && steps.upload-report.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          {
            echo "### SonarQube Community findings report"
            echo "Full current finding set, with exact locations: ${ARTIFACT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Guarded the same way as "Upload PR head findings report" above: a
      # fail-on-unanalyzed-languages failure in "Scan PR head" must not
      # skip the diff/policy/comment steps below - they're how that result
      # reaches the Check Run and PR comment, not just the job summary.
      # `!cancelled()`, not `always()`: a manual cancellation should still
      # skip these rather than race to finish a diff/policy run against a
      # scan that was deliberately cut short.
      - name: Resolve baseline findings file
        id: baseline-findings
        if: "!cancelled() && steps.head-scan.outputs.findings-report != ''"
        env:
          TIER_A_FOUND: ${{ steps.tier-a.outputs.found }}
          TIER_B_FOUND: ${{ steps.tier-b.outputs.found }}
          FALLBACK_BASE_DIR_EXISTS: ${{ steps.fallback-base-dir-check.outputs.exists }}
          FALLBACK_BASE_SCAN_FINDINGS: ${{ steps.fallback-base-scan.outputs.findings-json }}
          FALLBACK_DOTNET_BUILD_FAILURE_FINDINGS: ${{ steps.fallback-dotnet-build-failure.outputs.findings-json }}
          FALLBACK_EMPTY_BASELINE_FINDINGS: ${{ steps.fallback-empty-baseline.outputs.findings-json }}
        run: |
          set -euo pipefail
          if [[ "$TIER_A_FOUND" == "true" || "$TIER_B_FOUND" == "true" ]]; then
            # -type f and a sort make the choice deterministic rather than
            # dependent on directory order; an artifact is expected to hold
            # exactly one findings JSON. Same $RUNNER_TEMP path the tier a/b
            # lookup steps extracted the artifact into above.
            mapfile -t candidates < <(find "$RUNNER_TEMP/baseline-artifact" -type f -name '*.json' | sort)
            if (( ${#candidates[@]} == 0 )); then
              echo "Baseline artifact contained no JSON findings file." >&2
              exit 1
            fi
            if (( ${#candidates[@]} > 1 )); then
              echo "Baseline artifact contained ${#candidates[@]} JSON files; using ${candidates[0]}." >&2
            fi
            path="${candidates[0]}"
          elif [[ -n "$FALLBACK_DOTNET_BUILD_FAILURE_FINDINGS" ]]; then
            path="$FALLBACK_DOTNET_BUILD_FAILURE_FINDINGS"
          elif [[ "$FALLBACK_BASE_DIR_EXISTS" == "true" ]]; then
            path="$FALLBACK_BASE_SCAN_FINDINGS"
          else
            path="$FALLBACK_EMPTY_BASELINE_FINDINGS"
          fi
          if [[ -z "$path" ]]; then
            echo "Could not resolve a baseline findings file." >&2
            exit 1
          fi
          # Catch a truncated/corrupt baseline here, with a clear message,
          # rather than as a bare JSONDecodeError out of diff_findings.py.
          if ! jq -e 'type == "array"' "$path" >/dev/null 2>&1; then
            echo "Baseline findings file '$path' is not a JSON array." >&2
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Diff findings
        id: diff
        if: "!cancelled() && steps.head-scan.outputs.findings-report != ''"
        env:
          BASELINE_FINDINGS: ${{ steps.baseline-findings.outputs.path }}
          HEAD_FINDINGS: ${{ steps.head-scan.outputs.findings-json }}
        run: |
          new_findings_file="$RUNNER_TEMP/new-findings.json"
          removed_findings_file="$RUNNER_TEMP/removed-findings.json"
          python3 .sast-sonarqube/scripts/diff_findings.py \
            --baseline "$BASELINE_FINDINGS" \
            --head "$HEAD_FINDINGS" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --out "$new_findings_file" \
            --removed-out "$removed_findings_file"
          echo "new-findings=${new_findings_file}" >> "$GITHUB_OUTPUT"
          echo "removed-findings=${removed_findings_file}" >> "$GITHUB_OUTPUT"

      - name: Apply blocking policy
        id: policy
        if: "!cancelled() && steps.head-scan.outputs.findings-report != ''"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head-sha }}
          NEW_FINDINGS: ${{ steps.diff.outputs.new-findings }}
          SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
          BLOCKING: ${{ inputs.blocking }}
          CHECK_NAME: ${{ inputs.check-name }}
          UNANALYZED_LANGUAGES: ${{ steps.head-scan.outputs.unanalyzed-languages }}
          FAIL_ON_UNANALYZED: ${{ inputs.fail-on-unanalyzed-languages }}
          BASELINE_NOTE: ${{ steps.fallback-dotnet-build-failure.outputs.note }}
        run: |
          set -o pipefail
          # GitHub downgrades GITHUB_TOKEN to read-only for a pull_request
          # event from a fork, regardless of `permissions:` above - so on a
          # fork PR, apply_policy.py can't publish a Check Run (it degrades
          # to that gracefully, see gh_api's allow_forbidden) and the "Post
          # PR summary comment" step below is skipped outright. The job
          # summary is the one place findings are guaranteed to be visible
          # either way, so capture apply_policy.py's own summary there too,
          # not just the baseline-resolution tier. HEAD_SHA is this job's
          # own pr-context resolution, not github.event.pull_request.head.sha
          # directly - on a workflow_dispatch run that's the PR's resolved
          # head SHA (see resolve_pr_context.py), so the Check Run still
          # lands on the right commit.
          {
            echo "### SonarQube Community blocking policy"
            python3 .sast-sonarqube/scripts/apply_policy.py \
              --findings "$NEW_FINDINGS" \
              --threshold "$SEVERITY_THRESHOLD" \
              --blocking "$BLOCKING" \
              --repo "$REPO" \
              --sha "$HEAD_SHA" \
              --check-name "$CHECK_NAME" \
              --unanalyzed-languages "$UNANALYZED_LANGUAGES" \
              --fail-on-unanalyzed "$FAIL_ON_UNANALYZED" \
              --baseline-note "$BASELINE_NOTE" \
              --result-out "$RUNNER_TEMP/policy-result.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post PR summary comment
        # Posting a comment needs pull-requests: write, which - like
        # checks: write above - GitHub downgrades to read-only for a
        # pull_request event from a fork regardless of the permissions:
        # block this workflow requests. Skip outright rather than let it
        # 403: the job summary (see the policy step above) is where a fork
        # PR's findings are reported instead. The read-only downgrade is
        # specific to the pull_request event, NOT workflow_dispatch - a
        # maintainer-dispatched run gets the normal GITHUB_TOKEN permissions
        # from the permissions: block above even when scanning a fork's PR,
        # so it always attempts to post (see
        # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
        # and the write-access requirement to dispatch a workflow at
        # https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow).
        if: >-
          always() && inputs.post-pr-comment && steps.diff.outcome == 'success'
          && (github.event_name == 'workflow_dispatch' || steps.pr-context.outputs.is-fork != 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr-context.outputs.pr-number }}
          BASELINE_FINDINGS: ${{ steps.baseline-findings.outputs.path }}
          REMOVED_FINDINGS: ${{ steps.diff.outputs.removed-findings }}
          BASELINE_TIER: ${{ steps.baseline-final.outputs.tier }}
        run: |
          python3 .sast-sonarqube/scripts/post_pr_comment.py \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --result "$RUNNER_TEMP/policy-result.json" \
            --baseline-findings "$BASELINE_FINDINGS" \
            --removed-findings "$REMOVED_FINDINGS" \
            --baseline-tier "$BASELINE_TIER"

      - name: Tear down ephemeral SonarQube stack
        if: always()
        run: docker compose -f .sast-sonarqube/docker-compose.ephemeral.yml down -v
