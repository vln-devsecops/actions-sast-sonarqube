name: SonarQube Community PR scan

on:
  workflow_call:
    inputs:
      project-key:
        description: >-
          SonarQube project key to scan under. Only needs to be unique within
          a single job's ephemeral instance (every run gets a fresh
          SonarQube), so the repo name is a fine default - note SonarQube
          project keys can't contain "/", so this deliberately isn't
          github.repository (owner/repo).
        type: string
        default: ${{ github.event.repository.name }}
      project-base-dir:
        description: Path (relative to the repo root) to scan.
        type: string
        default: .
      severity-threshold:
        description: Minimum legacy severity (INFO/MINOR/MAJOR/CRITICAL/BLOCKER) a new finding must have to block the job.
        type: string
        default: MAJOR
      blocking:
        description: Whether a new finding at or above severity-threshold fails the job.
        type: boolean
        default: true
      post-pr-comment:
        description: Whether to post/update a human-readable summary comment on the PR.
        type: boolean
        default: true
      check-name:
        description: Name of the GitHub Check Run this workflow creates.
        type: string
        default: sonarqube-community/new-findings

jobs:
  pr-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_REF"

      - name: Resolve merge-base and target HEAD
        id: refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TARGET_HEAD_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "merge-base=${merge_base}" >> "$GITHUB_OUTPUT"
          echo "target-head-sha=${TARGET_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          git diff --name-only "${merge_base}..HEAD" > changed-files.txt
          echo "Files touched by this PR:"
          cat changed-files.txt

      # This reusable workflow is meant to be called by other repos, so it
      # can't assume its own composite action (action.yml) is checked out at
      # the workspace root - that root holds the CALLER's code. Fetch this
      # action's own repo, pinned to the exact ref this workflow file itself
      # is running from, into a side directory instead.
      - name: Resolve this action's own source ref
        id: action-source
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          ref="${WORKFLOW_REF#*@}"
          repo="${WORKFLOW_REF%%/.github/*}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout this action's source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.action-source.outputs.repo }}
          ref: ${{ steps.action-source.outputs.ref }}
          path: .sonarqube-community-action

      - name: "Look up baseline artifact (tier a: PR branch-off point)"
        id: tier-a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_NAME: sonar-baseline-${{ steps.refs.outputs.merge-base }}
        run: |
          found="$(python3 .sonarqube-community-action/scripts/find_baseline_artifact.py \
            --repo "$REPO" --name "$ARTIFACT_NAME" --dest .baseline-artifact)"
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      - name: "Look up baseline artifact (tier b: target branch current HEAD)"
        id: tier-b
        if: steps.tier-a.outputs.found != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_NAME: sonar-baseline-${{ steps.refs.outputs.target-head-sha }}
        run: |
          found="$(python3 .sonarqube-community-action/scripts/find_baseline_artifact.py \
            --repo "$REPO" --name "$ARTIFACT_NAME" --dest .baseline-artifact)"
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      - name: Record baseline resolution
        id: baseline
        run: |
          if [[ "${{ steps.tier-a.outputs.found }}" == "true" ]]; then
            tier="tier a: artifact for merge-base ${{ steps.refs.outputs.merge-base }}"
          elif [[ "${{ steps.tier-b.outputs.found }}" == "true" ]]; then
            tier="tier b: artifact for target branch HEAD ${{ steps.refs.outputs.target-head-sha }}"
          else
            tier="fallback: no artifact found, scanning target branch HEAD live in this job"
          fi
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          {
            echo "### SonarQube Community baseline resolution"
            echo "${tier}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline resolution: ${tier}"

      - name: Checkout target branch HEAD (fallback path only)
        if: steps.tier-a.outputs.found != 'true' && steps.tier-b.outputs.found != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline-checkout

      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start ephemeral SonarQube stack
        run: docker compose -f .sonarqube-community-action/docker-compose.ephemeral.yml up -d

      - name: Wait for SonarQube to be ready
        run: .sonarqube-community-action/scripts/wait_for_sonarqube.sh http://localhost:9000

      - name: Bootstrap admin token
        id: bootstrap
        run: |
          token="$(.sonarqube-community-action/scripts/bootstrap_sonarqube.sh http://localhost:9000 gha-pr)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Scan target branch HEAD (fallback path only)
        id: fallback-base-scan
        if: steps.tier-a.outputs.found != 'true' && steps.tier-b.outputs.found != 'true'
        uses: ./.sonarqube-community-action
        with:
          sonar-host-url: http://localhost:9000
          sonar-token: ${{ steps.bootstrap.outputs.token }}
          project-key: ${{ inputs.project-key }}-fallback-base
          project-base-dir: .baseline-checkout

      - name: Scan PR head
        id: head-scan
        uses: ./.sonarqube-community-action
        with:
          sonar-host-url: http://localhost:9000
          sonar-token: ${{ steps.bootstrap.outputs.token }}
          project-key: ${{ inputs.project-key }}
          project-base-dir: ${{ inputs.project-base-dir }}

      - name: Resolve baseline findings file
        id: baseline-findings
        run: |
          if [[ "${{ steps.tier-a.outputs.found }}" == "true" || "${{ steps.tier-b.outputs.found }}" == "true" ]]; then
            path="$(find .baseline-artifact -name '*.json' -print -quit)"
          else
            path="${{ steps.fallback-base-scan.outputs.findings-json }}"
          fi
          if [[ -z "$path" ]]; then
            echo "Could not resolve a baseline findings file." >&2
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Diff findings
        id: diff
        run: |
          python3 .sonarqube-community-action/scripts/diff_findings.py \
            --baseline "${{ steps.baseline-findings.outputs.path }}" \
            --head "${{ steps.head-scan.outputs.findings-json }}" \
            --changed-files changed-files.txt \
            --out new-findings.json
          echo "new-findings=new-findings.json" >> "$GITHUB_OUTPUT"

      - name: Apply blocking policy
        id: policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .sonarqube-community-action/scripts/apply_policy.py \
            --findings "${{ steps.diff.outputs.new-findings }}" \
            --threshold "${{ inputs.severity-threshold }}" \
            --blocking "${{ inputs.blocking }}" \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --check-name "${{ inputs.check-name }}" \
            --result-out policy-result.json

      - name: Post PR summary comment
        if: always() && inputs.post-pr-comment && steps.diff.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .sonarqube-community-action/scripts/post_pr_comment.py \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --result policy-result.json \
            --baseline-tier "${{ steps.baseline.outputs.tier }}"

      - name: Tear down ephemeral SonarQube stack
        if: always()
        run: docker compose -f .sonarqube-community-action/docker-compose.ephemeral.yml down -v
