name: SonarQube Community baseline scan

on:
  workflow_call:
    inputs:
      baseline-branches:
        description: >-
          JSON array of branch names to treat as SAST baselines (main plus
          any branch that's a PR target under branch protection). Push events
          on these branches get a full scan, published as a findings artifact
          keyed by commit SHA. Which branches qualify is a per-repo fact, so
          the caller workflow's own `on.push.branches` filter should match
          this list.
        type: string
        default: '["main"]'
      project-key:
        description: >-
          SonarQube project key to scan under. Only needs to be unique within
          a single job's ephemeral instance (every run gets a fresh
          SonarQube), so the repo name is a fine default - note SonarQube
          project keys can't contain "/", so this deliberately isn't
          github.repository (owner/repo).
        type: string
        default: ${{ github.event.repository.name }}
      project-base-dir:
        description: Path (relative to the repo root) to scan.
        type: string
        default: .
      artifact-retention-days:
        description: Retention period for the uploaded findings artifact.
        type: number
        default: 90
      sast-config-path:
        description: >-
          Path, relative to project-base-dir, to an optional noise-reduction
          config file (see the action README's ".sastrc" section).
        type: string
        default: .sastrc
      sast-ignore-path:
        description: >-
          Path, relative to project-base-dir, to an optional .gitignore-syntax
          path-exclusions file (see the action README's ".sastignore" section).
        type: string
        default: .sastignore
      runner-type:
        description: >-
          Value for runs-on. Defaults to ubuntu-latest; callers that want a
          self-hosted runner must resolve any fork-PR guard themselves and
          pass the already-resolved value here - a reusable workflow's own
          github.event_name is always "workflow_call", not the caller's
          actual triggering event, so it can't evaluate that condition
          itself (github.event.pull_request.head.repo.full_name is
          similarly unavailable in this context).
        type: string
        default: ubuntu-latest
      fail-on-unanalyzed-languages:
        description: >-
          Set true to fail this job when project-base-dir contains files in
          a language the plain sonar-scanner-cli can't analyze (see the
          action's unanalyzed-languages output and README). The findings
          JSON/report are still produced by the action before it fails -
          but with this true, a failing scan skips "Upload baseline
          findings artifact" below (no `if: always()` there), so a baseline
          build explicitly flagged incomplete is never published as
          authoritative for PRs to diff against. Default false: warn only -
          matches this action's v1 behavior.
        type: boolean
        default: false

jobs:
  baseline-scan:
    if: contains(fromJSON(inputs.baseline-branches), github.ref_name)
    runs-on: ${{ inputs.runner-type }}
    # Every long step below has its own deadline (wait_for_sonarqube.sh 300s,
    # run_scan.sh 600s), but image pulls and `docker compose up` don't - so
    # cap the job rather than inherit the 6-hour default on a wedged runner.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Checked out under a subdirectory, not the workspace root, so this
      # action's own source (checked out below, into a sibling directory)
      # never shares a directory with the pushed branch's own content.
      #
      # Clear the path first - independent of what an earlier job on the
      # same (possibly persistent, self-hosted) runner left there, not just
      # this job's own checkout below. This forces a fresh clone every run
      # rather than an incremental one on a persistent runner; acceptable
      # for the hardening it buys.
      - name: Clear caller checkout directory
        run: rm -rf -- ./src

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: src

      # This reusable workflow is meant to be called by other repos, so it
      # can't assume its own composite action (action.yml) is checked out
      # anywhere useful by default - the caller's own code lives under
      # ./src (checked out above), so fetch this action's own repo, pinned
      # to the exact ref this workflow file itself is running from, into a
      # sibling directory instead.
      - name: Resolve this action's own source ref
        id: action-source
        env:
          # github.workflow_ref is the *top-level* workflow that triggered
          # this run - for an external caller that's the CALLER's workflow
          # file, not this one. job.workflow_ref (job context, not github
          # context - there is no such thing as github.job_workflow_ref)
          # is the ref of the reusable workflow actually running this job,
          # which is what we need to check out our own source.
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          ref="${WORKFLOW_REF#*@}"
          repo="${WORKFLOW_REF%%/.github/*}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      # Clear this fixed path before use too, same as ./src above: a prior
      # job on the same runner may have left it behind as a symlink, no
      # trailing slash so a symlink at this path is removed itself rather
      # than followed.
      - name: Clear action source directory
        run: rm -rf -- ./.sast-sonarqube

      - name: Checkout this action's source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.action-source.outputs.repo }}
          ref: ${{ steps.action-source.outputs.ref }}
          path: .sast-sonarqube

      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start ephemeral SonarQube stack
        run: docker compose -f .sast-sonarqube/docker-compose.ephemeral.yml up -d

      - name: Wait for SonarQube to be ready
        run: .sast-sonarqube/scripts/wait_for_sonarqube.sh http://localhost:9000

      - name: Bootstrap admin token
        id: bootstrap
        run: |
          token="$(.sast-sonarqube/scripts/bootstrap_sonarqube.sh http://localhost:9000 gha-baseline)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Run scan
        id: scan
        uses: ./.sast-sonarqube
        with:
          sonar-host-url: http://localhost:9000
          sonar-token: ${{ steps.bootstrap.outputs.token }}
          project-key: ${{ inputs.project-key }}
          # project-base-dir is relative to the caller's own repo root; the
          # caller's checkout itself lives under ./src (see "Checkout"
          # above), so prefix it here rather than changing what the input
          # means to callers.
          project-base-dir: src/${{ inputs.project-base-dir }}
          sast-config-path: ${{ inputs.sast-config-path }}
          sast-ignore-path: ${{ inputs.sast-ignore-path }}
          fail-on-unanalyzed-languages: ${{ inputs.fail-on-unanalyzed-languages }}

      - name: Upload baseline findings artifact
        # Bundles the machine-readable JSON (what sonar-pr.yml's baseline
        # resolution actually reads back - see find_baseline_artifact.py)
        # with the human-readable report, so anyone browsing this run's
        # Artifacts section can see exact finding locations without
        # re-running the scan (the SonarQube instance itself is torn down
        # at the end of this job).
        uses: actions/upload-artifact@v7
        with:
          name: sonar-baseline-${{ github.sha }}
          path: |
            ${{ steps.scan.outputs.findings-json }}
            ${{ steps.scan.outputs.findings-report }}
          retention-days: ${{ inputs.artifact-retention-days }}
          # A baseline artifact is authoritative for every PR that resolves
          # it by SHA, so publishing an empty one is worse than publishing
          # none at all - the PR would diff against nothing and report every
          # pre-existing finding as new. Fail the baseline run instead.
          if-no-files-found: error

      - name: Tear down ephemeral SonarQube stack
        if: always()
        run: docker compose -f .sast-sonarqube/docker-compose.ephemeral.yml down -v
