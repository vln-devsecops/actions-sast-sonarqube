name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest tests/ -v

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  baseline:
    if: github.event_name == 'push'
    needs: unit-tests
    uses: ./.github/workflows/sonar-baseline.yml
    permissions:
      contents: read
    with:
      baseline-branches: '["dev"]'
      project-key: actions-sast-sonarqube-fixtures
      project-base-dir: fixtures

  pr-scan:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    uses: ./.github/workflows/sonar-pr.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      project-key: actions-sast-sonarqube-fixtures
      project-base-dir: fixtures
