version: 2
updates:
  # docker-compose.ephemeral.yml declares the pinned SonarQube Community Build
  # and Postgres images (and, via the inert `scanner` profile service, the
  # pinned sonar-scanner-cli image too) so a single directory scan covers all
  # three. See docker-compose.ephemeral.yml for why sonar-scanner-cli is
  # declared there instead of invoked with a hardcoded tag in a script.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  # .config/dotnet-tools.json pins dotnet-sonarscanner for scanner-mode:
  # dotnet (the single source of truth run_scan.sh reads), and the
  # fixtures-dotnet/ test project's NuGet references stay current too.
  - package-ecosystem: nuget
    directories:
      - /
      - /fixtures-dotnet/tiny
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(nuget)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
